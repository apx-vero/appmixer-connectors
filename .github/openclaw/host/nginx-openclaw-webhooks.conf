# Rate limiting zone — per IP, 10 req/min
limit_req_zone $binary_remote_addr zone=oc_hooks:10m rate=10r/m;

server {
    server_name 91-99-144-37.nip.io;

    # ✅ Jediný exponovaný endpoint
    location = /hooks/vero-mention {
        limit_req zone=oc_hooks burst=5 nodelay;

        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /hooks/vero-testing {
        limit_req zone=oc_hooks burst=5 nodelay;

        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /hooks/maya-docs {
        limit_req zone=oc_hooks burst=5 nodelay;

        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /hooks/vero-fix {
        limit_req zone=oc_hooks burst=5 nodelay;

        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # Status JSON for the appmixer-sanity Operations page (read-only, bearer token).
    location = /status/openclaw.json {
        limit_req zone=oc_hooks burst=5 nodelay;
        if ($http_authorization != "Bearer <OPENCLAW_STATUS_TOKEN>") { return 401; }
        default_type application/json;
        alias /var/lib/openclaw-status/status.json;
    }

    # ❌ Všechno ostatní — 403
    location / {
        return 403;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/91-99-144-37.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/91-99-144-37.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = 91-99-144-37.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 91-99-144-37.nip.io;
    return 404; # managed by Certbot


}